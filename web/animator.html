<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Runs animation code written by the AI. The editor loads this page in an iframe with sandbox="allow-scripts"
      (no allow-same-origin), so the code gets an opaque origin: no cookies, no storage, no access to the editor
      or the account. This policy also stops it from calling out to the network: only fonts load, and Remotion's
      license check reaches remotion.pro.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src https://fonts.gstatic.com https://fonts.googleapis.com https://www.remotion.pro data: blob:; worker-src blob:"
    />
    <title>Animator</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font: 12px/1.3 system-ui, sans-serif; color: #ddd; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/animator/main.ts"></script>
  </body>
</html>
